{% load static %}

<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Calistenia</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="{% static 'css/login.css' %}">

</head> <body>
<main class="login">

    <!-- Elemento decorativo -->
    <div class="login__glow"></div>


    <section class="login-card">

        <!-- Logo -->

        <a href="/home/" class="logo">
            <span class="logo__icon">C</span>
            <span class="logo__text">Calistenia</span>
        </a>


        <!-- Cabeçalho -->

        <div class="login-header">

            <span class="login-header__eyebrow">
                BEM-VINDO DE VOLTA
            </span>

            <h1>
                Entrar
            </h1>

            <p>
                Continue sua jornada e mantenha a consistência.
            </p>

        </div>


        <!-- Erro -->

        {% if error %}

            <div class="error-message">
                <span class="error-message__icon">!</span>

                <p>
                    {{ error }}
                </p>
            </div>

        {% endif %}


        <!-- Formulário -->

        <form method="post" class="login-form">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Usuário
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        @
                    </span>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <div class="form-label-row">

                    <label for="password">
                        Senha
                    </label>

                    <a href="#" class="forgot-password">
                        Esqueceu a senha?
                    </a>

                </div>


                <div class="input-wrapper">

                    <span class="input-icon">
                        •
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Mostrar senha"
                    >
                        ◉
                    </button>

                </div>

            </div>


            <button type="submit" class="login-button">

                <span>
                    Entrar
                </span>

                <span class="login-button__arrow">
                    →
                </span>

            </button>

        </form>


        <!-- Cadastro -->

        <div class="register">

            <span>
                Ainda não possui uma conta?
            </span>

            <a href="#">
                Criar conta
            </a>

        </div>

    </section>


    <!-- Frase lateral / inferior -->

    <p class="login-quote">
        CONSISTÊNCIA &nbsp;•&nbsp; DISCIPLINA &nbsp;•&nbsp; EVOLUÇÃO
    </p>

</main>


<script src="{% static 'js/login.js' %}"></script>

</body> </html>
